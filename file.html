<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d5c4b">
<title>ملف الحلقة</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body data-title="fileTitle">
<div class="wrap wide">
  <header id="brand" class="brand"></header>
  <main>
    <nav id="topnav" class="topnav"></nav>
    <div id="content">
      <div class="card me"><div><h2 id="fName"></h2><small id="fInfo"></small></div><a id="fBack" class="linkbtn" href="#" data-i18n="fileBack"></a></div>
      <div class="stats">
        <div class="stat blue"><b id="fR">0</b><span data-i18n="abReports"></span></div>
        <div class="stat ok"><b id="fP">0</b><span data-i18n="photos"></span></div>
        <div class="stat"><b id="fV">0</b><span data-i18n="videos"></span></div>
      </div>
      <a id="fDrive" class="btn ghost hidden" target="_blank" rel="noopener" style="text-align:center;text-decoration:none" data-i18n="fileDrive"></a>
      <div id="fList" style="margin-top:16px"></div>
    </div>
    <div id="lb" class="lb hidden">
      <a id="lbOpen" target="_blank" rel="noopener" onclick="event.stopPropagation()" data-i18n="openFull"></a>
      <button class="nv pv" id="lbPrev" aria-label="prev">❮</button>
      <img id="lbImg" alt="">
      <button class="nv nx" id="lbNext" aria-label="next">❯</button>
      <div class="cnt" id="lbN"></div>
    </div>
  </main>
  <footer class="ft" data-i18n="brandCo"></footer>
</div>
<div id="toast" class="hidden"></div>
<script src="js/config.js?v=2"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js?v=3"></script>
<script src="js/common.js"></script>
<script src="js/file.js"></script>
</body>
</html>
