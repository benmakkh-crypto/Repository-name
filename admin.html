<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d5c4b">
<title>تقرير حلقات القرآن الكريم</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title="navDash">
<div class="wrap wide">
  <header id="brand" class="brand"></header>
  <main>
    <nav id="topnav" class="topnav"></nav>
    <div id="content">
      <div class="card me"><div><h2 id="aName"></h2></div></div>
      <div class="card">
        <div class="fbar">
          <div><label class="f" for="aYear" data-i18n="year"></label><select id="aYear"></select></div>
          <div><label class="f" for="aMonth" data-i18n="month"></label><select id="aMonth"></select></div>
          <div><label class="f" for="aSearch" data-i18n="search"></label><input id="aSearch" type="text" data-ph="searchPh"></div>
        </div>
      </div>
      <div id="aExport" class="card hidden">
        <h2 data-i18n="exportTitle"></h2>
        <button id="exAll" class="btn ghost" data-i18n="exAll"></button>
        <button id="exRep" class="btn ghost" data-i18n="exRep"></button>
      </div>
      <div id="aStats" class="hidden">
        <div class="stats">
          <div class="stat"><b id="sTotal">0</b><span data-i18n="total"></span></div>
          <div class="stat ok"><b id="sDone">0</b><span data-i18n="done"></span></div>
          <div class="stat no"><b id="sMiss">0</b><span data-i18n="miss"></span></div>
        </div>
        <div class="meter"><i id="sBar" style="width:0"></i></div>
        <div class="tabs">
          <button id="fAll" class="on" data-i18n="fAll"></button>
          <button id="fDone" data-i18n="done"></button>
          <button id="fMiss" data-i18n="miss"></button>
        </div>
      </div>
      <div id="aList"></div>
    </div>
  </main>
  <footer class="ft" data-i18n="brandCo"></footer>
</div>
<div id="toast" class="hidden"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
