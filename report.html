<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08352c">
<title>بوابة التوثيق — حلقات القرآن الكريم</title>
<link rel="icon" href="assets/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="stylesheet" href="css/portal.css?v=2">
</head>
<body class="pb" data-title="pbTitle">
<header class="pb-hero">
  <div class="pb-in">
    <div class="pb-top">
      <div class="pb-logo"><span class="i"><img src="assets/logo.webp" alt=""></span><div><b data-i18n="title"></b><small data-i18n="brandSheikh"></small></div></div>
      <nav class="pb-lang" id="pbLang"><button data-l="ar">العربية</button><button data-l="en">English</button><button data-l="bn">বাংলা</button></nav>
    </div>
    <div class="pb-head">
      <div class="pb-ring">
        <svg viewBox="0 0 120 120"><defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c46a"/><stop offset="1" stop-color="#4be09a"/></linearGradient></defs>
          <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/><circle class="fg" id="pbArc" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div><b id="pbPct">0%</b><small data-i18n="pbRing"></small></div>
      </div>
      <div class="pb-txt">
        <h1 id="pbMonthTitle"></h1>
        <p id="pbWho"></p>
        <div class="pb-pills">
          <div class="pb-pill ok"><b id="kUp">0</b><span data-i18n="pbUploaded"></span></div>
          <div class="pb-pill warn"><b id="kMiss">0</b><span data-i18n="pbMissing"></span></div>
          <div class="pb-pill"><b id="kPh">0</b><span data-i18n="photos"></span></div>
          <div class="pb-pill"><b id="kVi">0</b><span data-i18n="videos"></span></div>
        </div>
      </div>
    </div>
  </div>
</header>
<main class="pb-body">
  <div class="pb-rail" id="pbMonths"></div>
  <div class="pb-bar">
    <input id="pbSearch" type="search" data-ph="searchPh">
    <div class="pb-seg"><button id="fAll" class="on" data-i18n="fAll"></button><button id="fDone" data-i18n="pbOnlyDone"></button><button id="fMiss" data-i18n="pbOnlyMiss"></button></div>
  </div>
  <div id="dList" class="pb-grid"></div>
  <div class="pb-foot" data-i18n="brandCo"></div>
</main>
<div id="pv" class="pbv hidden" role="dialog" aria-modal="true">
  <div class="pv-h"><div><b id="pvName"></b><small id="pvSub"></small></div><button class="pv-x" id="pvX" aria-label="close">✕</button></div>
  <div class="pv-s"><button class="pv-n p" id="pvP" aria-label="prev">❮</button><div id="pvStage" style="display:contents"></div><button class="pv-n x" id="pvN" aria-label="next">❯</button></div>
  <div class="pv-cap" id="pvCap"></div>
  <div class="pv-t" id="pvT"></div>
</div>
<div id="toast" class="hidden"></div>
<script src="js/config.js?v=2"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js?v=14"></script>
<script src="js/common.js"></script>
<script src="js/portal.js?v=3"></script>
</body>
</html>
