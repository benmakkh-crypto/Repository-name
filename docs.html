<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d5c4b">
<title>تقرير حلقات القرآن الكريم</title>
<link rel="icon" href="assets/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حلقات القرآن">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-title="dpTitle">
<div class="wrap wide">
  <header id="brand" class="brand"></header>
  <main>
    <nav id="topnav" class="topnav"></nav>
    <div id="content">
      <div class="card">
        <h2 class="ptitle" data-i18n="dpTitle"></h2>
        <p class="sub" style="margin:0" data-i18n="dpSub"></p>
      </div>
      <div class="stats">
        <div class="stat blue"><b id="tReports">0</b><span data-i18n="dpReports"></span></div>
        <div class="stat ok"><b id="tPhotos">0</b><span data-i18n="photos"></span></div>
        <div class="stat"><b id="tVideos">0</b><span data-i18n="videos"></span></div>
      </div>
      <div class="card">
        <div class="fbar">
          <div><label class="f" for="dYear" data-i18n="year"></label><select id="dYear"></select></div>
          <div><label class="f" for="dMonth" data-i18n="month"></label><select id="dMonth"></select></div>
          <div><label class="f" for="dSearch" data-i18n="search"></label><input id="dSearch" type="text" data-ph="searchPh"></div>
        </div>
        <div class="tabs" style="margin:16px 0 0">
          <button id="fAll" class="on" data-i18n="fAll"></button>
          <button id="fPhotos" data-i18n="photos"></button>
          <button id="fVideos" data-i18n="videos"></button>
        </div>
      </div>
      <div id="dList"></div>
    </div>
    <div id="lb" class="lb hidden">
      <a id="lbOpen" target="_blank" rel="noopener" onclick="event.stopPropagation()" data-i18n="openFull"></a>
      <button class="nv pv" id="lbPrev" aria-label="prev">❮</button>
      <img id="lbImg" alt="">
      <button class="nv nx" id="lbNext" aria-label="next">❯</button>
      <div class="cnt" id="lbN"></div>
    </div>
  </main>
  <footer class="ft" data-i18n="brandCo"></footer>
</div>
<div id="toast" class="hidden"></div>
<script src="js/config.js?v=2"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js?v=5"></script>
<script src="js/common.js"></script>
<script src="js/docs.js"></script>
</body>
</html>
