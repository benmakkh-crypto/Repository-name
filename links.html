<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d5c4b">
<title>تقرير حلقات القرآن الكريم</title>
<link rel="icon" href="assets/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حلقات القرآن">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-title="tpTitle">
<div class="wrap wide">
  <header id="brand" class="brand"></header>
  <main>
    <nav id="topnav" class="topnav"></nav>
    <div id="content">
      <div class="card">
        <h2 class="ptitle" data-i18n="lkTitle"></h2>
        <p class="sub" style="margin:0" data-i18n="lkSub"></p>
      </div>
      <div class="card">
        <h3 data-i18n="lkMonths"></h3>
        <p class="sub" data-i18n="lkMonthsSub"></p>
        <div id="lkMonths" class="fbar"></div>
      </div>
      <div class="card">
        <label class="f" data-i18n="lkRoot"></label>
        <div class="fbar"><input id="lkRootUrl" type="text" readonly dir="ltr"><button id="lkRootCopy" class="btn" data-i18n="lkCopy"></button></div>
        <div class="fbar" style="margin-top:12px"><input id="lkSearch" type="text" data-ph="searchPh"></div>
      </div>
      <div id="lkList"></div>
    </div>
  </main>
  <footer class="ft" data-i18n="brandCo"></footer>
</div>
<div id="toast" class="hidden"></div>
<script src="js/config.js?v=2"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js?v=8"></script>
<script src="js/common.js"></script>
<script src="js/links.js"></script>
</body>
</html>
